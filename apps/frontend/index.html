<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limn</title>
    <meta name="theme-color" content="#0b1020" />
    <!-- Brand favicon (the cursive "P"). Root-absolute public-asset paths — Vite
         base-prefixes them to '/app/...' in dev and in the production build, so they
         load whether the SPA is served locally or behind the cloud auth gate. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Brand wordmark font (the "Pierre" title) is SELF-HOSTED — the @font-face
         lives in src/index.css and the .woff2 is bundled from src/fonts/. It is
         deliberately NOT a Google Fonts <link>: that leaked every viewer's IP to
         Google on load (breaking local mode's no-phone-home promise) and forced the
         CSP to allowlist two third-party origins. Swap the family in index.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
