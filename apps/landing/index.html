<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Primary SEO. Everything between the seo:start/seo:end markers is REPLACED
         per route at build time by prerender.mjs, from the ROUTE_SEO table in
         src/lib/routes.ts — so /pricing ships its own title, description and
         canonical in the HTML rather than inheriting the home page's. What is
         written here is the home-page copy and the dev-server fallback; keep the
         markers, and keep the copy in sync with ROUTE_SEO['/']. -->
    <!-- seo:start -->
    <title>Limn — shine a light on your software projects</title>
    <meta
      name="description"
      content="Your work spans repositories, people and a growing stack of review automation. Limn lights all of it on one board — whose turn it is, what is stalled, what is ready to land — and measures what the AI review bots on top are actually worth. Free and open core."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter (home defaults; useSeo() sets per-route title/desc/url). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Limn" />
    <meta property="og:title" content="Limn — shine a light on your software projects" />
    <meta
      property="og:description"
      content="Repositories, people and a growing stack of review automation, on one board. Limn lights up the whole review loop: whose turn it is, what is stalled, what is ready to land — and what the review bots on top are actually worth. Free and open core."
    />
    <meta property="og:image" content="https://pierre-review.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Limn board showing everything waiting across a team’s repositories, ranked most actionable first."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Limn — shine a light on your software projects" />
    <meta
      name="twitter:description"
      content="Repositories, people and a growing stack of review automation, on one board. Limn lights up the whole review loop: whose turn it is, what is stalled, what is ready to land — and what the review bots on top are actually worth. Free and open core."
    />
    <meta name="twitter:image" content="https://pierre-review.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Limn board showing everything waiting across a team’s repositories, ranked most actionable first."
    />
    <!-- seo:end -->

    <!-- Favicons (generated from the brand mark). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: helps search engines understand what Limn is.
         LANDMINE: this block sits OUTSIDE the seo:start/end markers, so the
         prerenderer copies it verbatim into EVERY route — /privacy and /terms ship
         this price too. It is a second, site-wide copy of both the product name
         and the price; when either changes it must change here as well as in
         src/lib/routes.ts, src/lib/site.ts and src/components/feint/TierTable.tsx.
         ⚠ IT WENT STALE ONCE ALREADY: it advertised Pro at $15 and a Pro+ tier at
         $29 for as long as those were true on a pricing page that no longer
         exists, which is exactly the failure a second copy invites. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pierre-review.com/#org",
            "name": "Limn",
            "url": "https://pierre-review.com/",
            "logo": "https://pierre-review.com/icon-512.png",
            "sameAs": ["https://github.com/alexwakeman/pierre-review"]
          },
          {
            "@type": "WebSite",
            "@id": "https://pierre-review.com/#site",
            "name": "Limn",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Limn",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web, macOS, Linux, Windows",
            "description": "One board above every repository a team works in: what is waiting and on whom, what is stalled, what is ready to land, how the work moved over a sprint — and an independent grade on every AI review bot comment.",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" },
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "25",
              "offerCount": "2",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "Free",
                  "description": "The open-core product: the cross-repo worklist, triaged review threads, merge and conflict resolution in place, flow metrics per workspace, and an independent grade on every bot comment. No repository limit, no user limit, no expiry.",
                  "price": "0",
                  "priceCurrency": "USD"
                },
                {
                  "@type": "Offer",
                  "name": "Pro",
                  "description": "The roll-up across repositories, people and periods: a forwardable report per sprint, Chronology, the per-bot keep / tune / noisy scoreboard and the peer benchmark, plus written summaries on pull requests. $25 per user per month.",
                  "price": "25",
                  "priceCurrency": "USD",
                  "priceSpecification": {
                    "@type": "UnitPriceSpecification",
                    "price": "25",
                    "priceCurrency": "USD",
                    "billingIncrement": 1,
                    "unitText": "MONTH"
                  }
                }
              ]
            },
            "softwareHelp": "https://github.com/alexwakeman/pierre-review"
          }
        ]
      }
    </script>

    <!-- The three typefaces (Archivo, Newsreader, JetBrains Mono) are SELF-HOSTED:
         the @font-face blocks live in src/index.css and the .woff2 files ship from
         src/fonts/. They are never fetched from Google, for three independent
         reasons — `font-src 'self'` in the landing CSP blocks fonts.gstatic.com,
         `style-src 'self' 'unsafe-inline'` does not permit a <link> to
         fonts.googleapis.com, and a test pins that directive so it fails CI before
         a browser ever sees it. On top of that it is a GDPR requirement: a gstatic
         request discloses every visitor's IP to Google before consent, and Google
         Fonts' recommended <link ... onload="this.media='all'"> would force
         script-src 'unsafe-inline'. Same-origin + font-display:swap keeps them off
         the critical path with no inline handler.
         See apps/backend/src/api/plugins/security.ts. -->
  </head>
  <body>
    <!-- Everything between app:start/app:end is REPLACED at build time by
         prerender.mjs with the route's fully-rendered markup, so the page has real,
         readable content before a single byte of JS executes — for no-JS visitors,
         for AI agents and crawlers that do not run scripts, and as the first paint
         for everyone else. React's createRoot() replaces it on mount exactly as it
         replaced the splash below.

         What survives here is the DEV-server fallback (prerender.mjs only rewrites
         the built dist/): a plain wordmark on paper, so the first paint is already
         the right colour instead of a white flash. It is set in system-ui rather
         than Archivo because the bundled font has not loaded at this point — and it
         carries no animation, because the site does not move. -->
    <div id="root">
      <!-- app:start -->
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafaf8; color: #16161a"
      >
        <span
          style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -0.02em"
          >Limn<span style="color: #c13a20">.</span></span
        >
      </div>
      <!-- app:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
