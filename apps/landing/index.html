<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Primary SEO. Everything between the seo:start/seo:end markers is REPLACED
         per route at build time by prerender.mjs, from the ROUTE_SEO table in
         src/lib/routes.ts — so /contact ships its own title, description and
         canonical in the HTML rather than inheriting the home page's. What is
         written here is the home-page copy and the dev-server fallback; keep the
         markers, and keep the copy in sync with ROUTE_SEO['/']. -->
    <!-- seo:start -->
    <title>Limn — plan your day across every repository</title>
    <meta
      name="description"
      content="Limn opens on one board that answers what to work on today: review requests, replies, red builds, conflicts and pull requests ready to land, from every repository, ranked. You decide what counts as your turn and in what order. Claude reviews and fixes pull requests on your own Claude login. 100% free, runs on your machine: npx limn-review."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter (home defaults; useSeo() sets per-route title/desc/url). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Limn" />
    <meta property="og:title" content="Limn — plan your day across every repository" />
    <meta
      property="og:description"
      content="Limn opens on one board that answers what to work on today: review requests, replies, red builds, conflicts and pull requests ready to land, from every repository, ranked. You decide what counts as your turn and in what order. Claude reviews and fixes pull requests on your own Claude login. 100% free, runs on your machine: npx limn-review."
    />
    <meta property="og:image" content="https://pierre-review.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Limn board showing everything waiting across a team’s repositories, ranked most actionable first."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Limn — plan your day across every repository" />
    <meta
      name="twitter:description"
      content="Limn opens on one board that answers what to work on today: review requests, replies, red builds, conflicts and pull requests ready to land, from every repository, ranked. You decide what counts as your turn and in what order. Claude reviews and fixes pull requests on your own Claude login. 100% free, runs on your machine: npx limn-review."
    />
    <meta name="twitter:image" content="https://pierre-review.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Limn board showing everything waiting across a team’s repositories, ranked most actionable first."
    />
    <!-- seo:end -->

    <!-- Favicons: the Limn mark, rendered from apps/landing/src/lib/sprites.ts by
         `node scripts/make-favicons.mjs`. Regenerate there, never by hand. -->
    <!-- ⚠ THE SVG MUST STAY FIRST AND KEEP ITS `type`. A tab slot is 16 CSS px — 32 device px
         at DPR 2 — and Chrome picks ONE of these and scales it, so any pick but an exact 1:1
         raster resamples a grid whose features are one pixel wide and reads as blur. Declared
         this way Chrome takes the SVG and `shape-rendering: crispEdges` snaps it to the device
         grid at every DPR. The PNGs remain for Safari < 16.4 and the big-raster surfaces. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: helps search engines understand what Limn is.
         LANDMINE: this block sits OUTSIDE the seo:start/end markers, so the
         prerenderer copies it verbatim into EVERY route. It is a second, site-wide
         copy of the product name and the price (0), so when either changes it must
         change here as well as in src/lib/routes.ts and src/lib/site.ts.
         There is one offer and it is free: Limn is local-only, installed from npm,
         with no hosted tier. The licence limit (organisations with more than three
         users need a commercial licence) is described in words, not as a price. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pierre-review.com/#org",
            "name": "Limn",
            "url": "https://pierre-review.com/",
            "logo": "https://pierre-review.com/icon-512.png",
            "sameAs": ["https://github.com/alexwakeman/pierre-review"]
          },
          {
            "@type": "WebSite",
            "@id": "https://pierre-review.com/#site",
            "name": "Limn",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Limn",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "macOS, Linux, Windows",
            "softwareRequirements": "Node.js 20 or later",
            "downloadUrl": "https://www.npmjs.com/package/limn-review",
            "description": "Plans your day across every repository a team works in: one ranked board of what is waiting and on whom, by rules each person sets — plus how the work moved over a sprint, an independent grade on every AI review bot comment, and Claude reviews and fixes on your own Claude login. Runs on your machine; install with npx limn-review.",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" },
            "offers": {
              "@type": "Offer",
              "name": "Free",
              "description": "Every feature, free. Free for individuals, and for organisations where no more than three people use it; more users than that need a commercial licence via the contact form.",
              "price": "0",
              "priceCurrency": "USD"
            },
            "softwareHelp": "https://github.com/alexwakeman/pierre-review"
          }
        ]
      }
    </script>

    <!-- The three typefaces (Archivo, Newsreader, JetBrains Mono) are SELF-HOSTED:
         the @font-face blocks live in src/index.css and the .woff2 files ship from
         src/fonts/. They are never fetched from Google, for three independent
         reasons — `font-src 'self'` in the landing CSP blocks fonts.gstatic.com,
         `style-src 'self' 'unsafe-inline'` does not permit a <link> to
         fonts.googleapis.com, and a test in apps/site pins that directive so it
         fails CI before a browser ever sees it. On top of that it is a GDPR requirement: a gstatic
         request discloses every visitor's IP to Google before consent, and Google
         Fonts' recommended <link ... onload="this.media='all'"> would force
         script-src 'unsafe-inline'. Same-origin + font-display:swap keeps them off
         the critical path with no inline handler.
         See apps/site/src/security.ts. -->
  </head>
  <body>
    <!-- Everything between app:start/app:end is REPLACED at build time by
         prerender.mjs with the route's fully-rendered markup, so the page has real,
         readable content before a single byte of JS executes — for no-JS visitors,
         for AI agents and crawlers that do not run scripts, and as the first paint
         for everyone else. React's createRoot() replaces it on mount exactly as it
         replaced the splash below.

         What survives here is the DEV-server fallback (prerender.mjs only rewrites
         the built dist/): a plain wordmark on paper, so the first paint is already
         the right colour instead of a white flash. It is set in system-ui rather
         than Archivo because the bundled font has not loaded at this point — and it
         carries no animation, because the site does not move. -->
    <div id="root">
      <!-- app:start -->
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafaf8; color: #16161a"
      >
        <span
          style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -0.02em"
          >Limn<span style="color: #c13a20">.</span></span
        >
      </div>
      <!-- app:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
