<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />

    <!-- Primary SEO. These are the home-page defaults / what a no-JS crawler sees;
         per-route <title>/description/canonical/og:url are set at runtime by the
         useSeo() hook (src/lib/seo.ts) — so canonical is NOT hard-coded here (a
         non-JS crawl of a sub-page would otherwise canonicalise it to home). -->
    <title>Pierre — the calm layer above your review bot</title>
    <meta
      name="description"
      content="Bring your own reviewer. Pierre is the cross-repo layer above CodeRabbit, Greptile and Copilot — what’s stalled, whose turn it is, and which of the bot’s comments a human still needs to read."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter (home defaults; useSeo() sets per-route title/desc/url). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pierre" />
    <meta property="og:title" content="Pierre — the calm layer above your review bot" />
    <meta
      property="og:description"
      content="Your review bot flags 40 things; Pierre shows you the 3 that matter. The calm, cross-repo triage layer above CodeRabbit, Greptile and Copilot — with the AI spend you control."
    />
    <meta property="og:image" content="https://pierre-review.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Pierre timeline dashboard showing pull-request activity across a team’s repositories."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pierre — the calm layer above your review bot" />
    <meta
      name="twitter:description"
      content="Your review bot flags 40 things; Pierre shows you the 3 that matter. The calm, cross-repo triage layer above CodeRabbit, Greptile and Copilot — with the AI spend you control."
    />
    <meta name="twitter:image" content="https://pierre-review.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Pierre timeline dashboard showing pull-request activity across a team’s repositories."
    />

    <!-- Favicons (generated from the brand mark). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: helps search engines understand what Pierre is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pierre-review.com/#org",
            "name": "Pierre",
            "url": "https://pierre-review.com/",
            "logo": "https://pierre-review.com/icon-512.png",
            "sameAs": ["https://github.com/alexwakeman/pierre-review"]
          },
          {
            "@type": "WebSite",
            "@id": "https://pierre-review.com/#site",
            "name": "Pierre",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Pierre",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web, macOS, Linux, Windows",
            "description": "A timeline-first dashboard for tracking a team’s GitHub activity across repositories — sprint situational awareness, PR triage, team insights, flow metrics, and human-in-the-loop AI review.",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" },
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "5",
              "offerCount": "2",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "Free",
                  "description": "The open-core dashboard: timeline, Activity feed, PR detail and write actions. Free forever.",
                  "price": "0",
                  "priceCurrency": "USD"
                },
                {
                  "@type": "Offer",
                  "name": "Pro",
                  "description": "The intelligence layer: AI summaries, team Insights, flow metrics, Slack digests and My Turn. $5 per month.",
                  "price": "5",
                  "priceCurrency": "USD",
                  "priceSpecification": {
                    "@type": "UnitPriceSpecification",
                    "price": "5",
                    "priceCurrency": "USD",
                    "billingIncrement": 1,
                    "unitText": "MONTH"
                  }
                }
              ]
            },
            "softwareHelp": "https://github.com/alexwakeman/pierre-review"
          }
        ]
      }
    </script>

    <!-- Brand wordmark font (the "Pierre" title). Loaded NON-render-blocking
         (media="print" → flipped to "all" on load) so it never holds first paint
         — iOS Safari otherwise blanks the screen on a cross-origin stylesheet.
         Great Vibes ships a single 400 weight — never bolden it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Splash caret blink (matches the in-app HeroWordmark caret) — defined inline
         so the pre-React splash can blink before the bundled CSS loads. */
      @keyframes pierre-splash-caret {
        0%,
        50% {
          opacity: 1;
        }
        50.01%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Instant splash so mobile Safari paints immediately instead of a white screen
         while the JS bundle loads. Opens on the SAME terminal "PR" prompt the
         HeroWordmark animation starts from, so load→animation is seamless. Lives
         INSIDE #root, so React's createRoot().render() replaces it on mount. -->
    <div id="root">
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #f3f4f6"
      >
        <span
          style="display: inline-flex; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 3rem; line-height: 1; letter-spacing: 0.04em"
        >
          PR<span
            style="display: inline-block; width: 0.1em; height: 0.92em; margin-left: 0.16em; background: #38bdf8; animation: pierre-splash-caret 1s steps(1, end) infinite"
          ></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
