<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pierre — team GitHub activity, at a glance</title>
    <meta
      name="description"
      content="Pierre is a timeline-first dashboard for sprint situational awareness — see who's doing what across your repos, which PRs are stalled, and what needs your review right now."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>"
    />
    <!-- Brand wordmark font (the "Pierre" title). Loaded from Google Fonts. Great
         Vibes is a single 400 weight — never bolden it (faux-bold mangles the script). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded NON-render-blocking: fetched as media="print" so it never blocks
         first paint, then flipped to "all" once it arrives (the decorative wordmark
         falls back to cursive until then). iOS Safari otherwise holds first paint
         for this cross-origin stylesheet — the cause of the mobile blank screen. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Splash caret blink (matches the in-app HeroWordmark caret) — defined inline
         so the pre-React splash can blink before the bundled CSS loads. */
      @keyframes pierre-splash-caret {
        0%,
        50% {
          opacity: 1;
        }
        50.01%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Instant splash so mobile Safari paints immediately instead of a white screen
         while the JS bundle loads. It opens on the SAME terminal "PR" prompt the
         HeroWordmark animation starts from, so the load→animation handoff is seamless.
         Lives INSIDE #root, so React's createRoot().render() replaces it on mount —
         no teardown. Inline styles (not the bundled CSS) so it shows before the app's
         CSS loads; background matches App's bg-gray-950 (#030712) for zero flash. -->
    <div id="root">
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #f3f4f6"
      >
        <span
          style="display: inline-flex; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 3rem; line-height: 1; letter-spacing: 0.04em"
        >
          PR<span
            style="display: inline-block; width: 0.1em; height: 0.92em; margin-left: 0.16em; background: #38bdf8; animation: pierre-splash-caret 1s steps(1, end) infinite"
          ></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
