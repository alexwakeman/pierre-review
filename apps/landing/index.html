<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />

    <!-- Primary SEO. Everything between the seo:start/seo:end markers is REPLACED
         per route at build time by prerender.mjs, from the ROUTE_SEO table in
         src/lib/routes.ts — so /pricing ships its own title, description and
         canonical in the HTML rather than inheriting the home page's. What is
         written here is the home-page copy and the dev-server fallback; keep the
         markers, and keep the copy in sync with ROUTE_SEO['/']. -->
    <!-- seo:start -->
    <title>Pierre — the calm layer above your review bot</title>
    <meta
      name="description"
      content="Bring your own reviewer. Pierre is the cross-repo layer above CodeRabbit, Greptile and Copilot — what’s stalled, whose turn it is, and which of the bot’s comments a human still needs to read."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter (home defaults; useSeo() sets per-route title/desc/url). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pierre" />
    <meta property="og:title" content="Pierre — the calm layer above your review bot" />
    <meta
      property="og:description"
      content="Your review bot flags 40 things; Pierre shows you the 3 that matter. The calm, cross-repo triage layer above CodeRabbit, Greptile and Copilot — with the AI spend you control."
    />
    <meta property="og:image" content="https://pierre-review.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Pierre timeline dashboard showing pull-request activity across a team’s repositories."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pierre — the calm layer above your review bot" />
    <meta
      name="twitter:description"
      content="Your review bot flags 40 things; Pierre shows you the 3 that matter. The calm, cross-repo triage layer above CodeRabbit, Greptile and Copilot — with the AI spend you control."
    />
    <meta name="twitter:image" content="https://pierre-review.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Pierre timeline dashboard showing pull-request activity across a team’s repositories."
    />
    <!-- seo:end -->

    <!-- Favicons (generated from the brand mark). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: helps search engines understand what Pierre is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pierre-review.com/#org",
            "name": "Pierre",
            "url": "https://pierre-review.com/",
            "logo": "https://pierre-review.com/icon-512.png",
            "sameAs": ["https://github.com/alexwakeman/pierre-review"]
          },
          {
            "@type": "WebSite",
            "@id": "https://pierre-review.com/#site",
            "name": "Pierre",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Pierre",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web, macOS, Linux, Windows",
            "description": "A timeline-first dashboard for tracking a team’s GitHub activity across repositories — sprint situational awareness, PR triage, team insights, flow metrics, and human-in-the-loop AI review.",
            "url": "https://pierre-review.com/",
            "publisher": { "@id": "https://pierre-review.com/#org" },
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "5",
              "offerCount": "2",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "Free",
                  "description": "The open-core dashboard: timeline, Activity feed, PR detail and write actions. Free forever.",
                  "price": "0",
                  "priceCurrency": "USD"
                },
                {
                  "@type": "Offer",
                  "name": "Pro",
                  "description": "The intelligence layer: AI summaries, team Insights, flow metrics, Slack digests and My Turn. $5 per month.",
                  "price": "5",
                  "priceCurrency": "USD",
                  "priceSpecification": {
                    "@type": "UnitPriceSpecification",
                    "price": "5",
                    "priceCurrency": "USD",
                    "billingIncrement": 1,
                    "unitText": "MONTH"
                  }
                }
              ]
            },
            "softwareHelp": "https://github.com/alexwakeman/pierre-review"
          }
        ]
      }
    </script>

    <!-- Brand wordmark font (the "Pierre" title) is SELF-HOSTED: the @font-face is
         in src/index.css and the .woff2 ships from src/fonts/. This replaced a
         cross-origin Google Fonts <link> that (a) disclosed every visitor's IP to
         Google before any consent was given, and (b) needed an inline
         onload="this.media='all'" handler — which would have forced
         script-src 'unsafe-inline' into the CSP. Same-origin + font-display:swap
         keeps it off the critical path without the inline handler.
         Great Vibes ships a single 400 weight — never bolden it. -->
    <style>
      /* Splash caret blink (matches the in-app HeroWordmark caret) — defined inline
         so the pre-React splash can blink before the bundled CSS loads. */
      @keyframes pierre-splash-caret {
        0%,
        50% {
          opacity: 1;
        }
        50.01%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Everything between app:start/app:end is REPLACED at build time by
         prerender.mjs with the route's fully-rendered markup, so the page has real,
         readable content before a single byte of JS executes — for no-JS visitors,
         for AI agents and crawlers that do not run scripts, and as the first paint
         for everyone else. React's createRoot() replaces it on mount exactly as it
         replaced the splash below.

         What survives here is the DEV-server fallback (prerender.mjs only rewrites
         the built dist/): an instant splash so mobile Safari paints immediately
         instead of a white screen, opening on the same terminal "PR" prompt the
         HeroWordmark animation starts from. -->
    <div id="root">
      <!-- app:start -->
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #f3f4f6"
      >
        <span
          style="display: inline-flex; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 3rem; line-height: 1; letter-spacing: 0.04em"
        >
          PR<span
            style="display: inline-block; width: 0.1em; height: 0.92em; margin-left: 0.16em; background: #38bdf8; animation: pierre-splash-caret 1s steps(1, end) infinite"
          ></span>
        </span>
      </div>
      <!-- app:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
