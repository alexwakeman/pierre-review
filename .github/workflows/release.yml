name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # The sandbox image push to GHCR (docs/RELEASE.md § The sandbox image).
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Loop guard: the bot's own bump commit (chore(release): ...) must never
    # re-trigger this workflow on push. Manual dispatch runs only from main.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # pnpm version is taken from the root package.json "packageManager" field,
      # so CI, the Dockerfile (corepack), and local dev all run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # EVERYTHING, slow project included (docs/TESTING.md): a PR ran only the slow files it
      # could affect, so main is where the whole suite is proven before a publish.
      - run: pnpm test:all

      # Browser regression gate for the My Turn / Feed / Focus-mode UX flows. Uses
      # API-mocked fixtures (no backend) against the Vite dev server it boots itself.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E regression tests
        run: pnpm test:e2e

      - name: Compute & bump version
        id: bump
        run: |
          set -euo pipefail
          cd apps/backend
          # Base the bump on the HIGHEST version known anywhere — npm's latest, the
          # committed package.json, and the newest git tag — so we never reuse a
          # version even if main, the tags, and npm have drifted out of sync (e.g. a
          # prior run pushed a tag/commit but its publish failed). This is what makes
          # the pipeline self-heal instead of colliding on an existing tag.
          # The package is `limn-review` (renamed from `pierre-review`). The OLD name's latest still
          # counts toward the highest version, so the new name continues the sequence instead of
          # restarting it — one version line across the rename.
          NPM_VER="$(npm view limn-review version 2>/dev/null || echo 0.0.0)"
          OLD_NPM_VER="$(npm view pierre-review version 2>/dev/null || echo 0.0.0)"
          PKG_VER="$(node -p "require('./package.json').version")"
          TAG_VER="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)"
          TAG_VER="${TAG_VER:-0.0.0}"
          BASE="$(printf '%s\n%s\n%s\n%s\n' "$NPM_VER" "$OLD_NPM_VER" "$PKG_VER" "$TAG_VER" | sort -V | tail -1)"
          echo "Highest known version: $BASE  (npm=$NPM_VER old-npm=$OLD_NPM_VER pkg=$PKG_VER tag=$TAG_VER)"
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          npm version "$BASE" --no-git-tag-version --allow-same-version >/dev/null
          NEXT="$(npm version "$BUMP" --no-git-tag-version)"
          NEXT="${NEXT#v}"
          # Defence in depth: never emit a version whose tag already exists.
          while git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null \
                || git ls-remote --exit-code --tags origin "v$NEXT" >/dev/null 2>&1; do
            echo "Tag v$NEXT already exists — skipping it."
            NEXT="$(npm version "$BUMP" --no-git-tag-version)"
            NEXT="${NEXT#v}"
          done
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT"

      # THE SANDBOX IMAGE (docs/RELEASE.md § The sandbox image; docs/SANDBOX.md § The image). Built for
      # amd64 + arm64 from apps/backend/sandbox-image and pushed to GHCR as <version>; its manifest-list
      # DIGEST goes to `pnpm package`, which pins it in the release manifest (`limnSandboxImage`).
      # ⚠ NON-FATAL BY DESIGN: every step below is continue-on-error, and the package step only pins when
      # the push succeeded. A failed image push ships the release UNPINNED; the app then builds the image
      # locally on first use. The recipe comes from the app's own module (scripts/sandbox-image.ts).
      - name: Sandbox image recipe
        id: sandbox_recipe
        continue-on-error: true
        run: |
          set -euo pipefail
          cd apps/backend
          ./node_modules/.bin/tsx scripts/sandbox-image.ts > "$RUNNER_TEMP/sandbox-recipe.json"
          F="$RUNNER_TEMP/sandbox-recipe.json"
          echo "recipe=$(node -p "require('$F').recipe")" >> "$GITHUB_OUTPUT"
          echo "claude=$(node -p "require('$F').buildArgs.CLAUDE_CODE_VERSION")" >> "$GITHUB_OUTPUT"
          echo "codex=$(node -p "require('$F').buildArgs.CODEX_VERSION")" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/limn-sandbox" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 image)
        id: qemu
        if: steps.sandbox_recipe.outcome == 'success'
        continue-on-error: true
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        if: steps.qemu.outcome == 'success'
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        id: ghcr_login
        if: steps.buildx.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push the sandbox image
        id: sandbox_image
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/sandbox-image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.sandbox_recipe.outputs.repository }}:${{ steps.bump.outputs.version }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.sandbox_recipe.outputs.claude }}
            CODEX_VERSION=${{ steps.sandbox_recipe.outputs.codex }}
            LIMN_RECIPE=${{ steps.sandbox_recipe.outputs.recipe }}

      - name: Build the npm release package
        env:
          # Empty unless the push above succeeded: build-release.mjs then writes no pin.
          LIMN_SANDBOX_IMAGE_REPOSITORY: ${{ steps.sandbox_image.outcome == 'success' && steps.sandbox_recipe.outputs.repository || '' }}
          LIMN_SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox_image.outcome == 'success' && steps.sandbox_image.outputs.digest || '' }}
          LIMN_SANDBOX_IMAGE_RECIPE: ${{ steps.sandbox_recipe.outputs.recipe }}
        run: pnpm package

      - name: Commit, tag & push (atomic)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/package.json
          git commit -m "chore(release): bump to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          # Atomic: the commit and tag land together or not at all, so a rejected
          # push never leaves a dangling tag for the next run to collide on.
          git push --atomic origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        working-directory: release
        run: |
          set -euo pipefail
          VER="${{ steps.bump.outputs.version }}"
          # The name comes from the manifest build-release.mjs wrote (limn-review), never typed here.
          NAME="$(node -p "require('./package.json').name")"
          # Idempotent: if this version is already on npm (e.g. a re-run), skip
          # rather than fail the job on the "cannot publish over existing version".
          if [ -n "$(npm view "$NAME@$VER" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VER is already published — skipping."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
