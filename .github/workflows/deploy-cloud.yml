name: Deploy cloud image

# Builds the PRIVATE cloud image (the OSS app + the @pierre/pro summary-AI plugin) and pushes it
# to GitHub Container Registry, from where Railway deploys it. This workflow is deliberately
# GENERIC — it checks out the private `packages/pro` submodule via a read-only deploy key and runs
# a standard docker build/push. It never prints Pro source; only dependency names (already public)
# ever surface. The PUBLIC npm publish (release.yml) does NOT check out the submodule and never
# passes --with-pro, so its zero-AI-deps guarantee is untouched.
#
# Runs on every push to main (skipping doc/CI-only pushes and the release bump commit) AND on
# manual dispatch. It builds the image + pushes to GHCR; the last step redeploys Railway.
#
# Required repo secrets:
#   PRO_DEPLOY_KEY  — an SSH read-only deploy key on alexwakeman/pierre-pro (fetches the submodule)
#   (optional) VITE_GA_ID       — build-time Google Analytics id inlined into the SPA/landing
#   (optional) RAILWAY_TOKEN    — a Railway token to redeploy after the image is pushed
#                                 (else enable Railway's own "redeploy on image change")
#   (optional) RAILWAY_SERVICE  — service name; set alongside a PROJECT-scoped RAILWAY_TOKEN so
#                                 `railway redeploy` targets the right service
#
# Railway service (configured once, in the dashboard — see docs/DEPLOY-RAILWAY.md):
#   - Source: deploy from the GHCR image ghcr.io/<owner>/pierre-review-cloud:latest (+ a GHCR
#     pull credential), NOT the Dockerfile.
#   - Variables: PRO_CLOUD_ENABLED=true, PRO_DIGEST_ENABLED=true, SUMMARY_ANTHROPIC_API_KEY=...,
#     STRIPE_PAYMENT_LINK_URL, STRIPE_WEBHOOK_SECRET, plus the existing cloud vars (DATABASE_URL,
#     APP_BASE_URL, GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET, SESSION_SECRET,
#     ENCRYPTION_KEY). Leave PRO_ADVANCED_AI_ENABLED
#     UNSET so agentic AI (Claude Review / AI Fix) stays off in cloud.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # Doc/CI-only pushes don't change the image — skip them (mirrors the Railway
    # Watch Paths list). A mixed push (docs + code) still deploys, since paths-ignore
    # only skips when EVERY changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - '.claude/**'
      - 'docker-compose.yml'

concurrency:
  # One deploy at a time; a newer push cancels an in-flight build (don't waste minutes
  # shipping a superseded commit).
  group: deploy-cloud
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pierre-review-cloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The release workflow auto-commits `chore(release): bump … [skip ci]` on every main
    # push; `[skip ci]` already skips this run, but guard explicitly too so a bump can never
    # rebuild the image (a manual dispatch always runs).
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      # Check out the public repo AND the private packages/pro submodule (SSH via the read-only
      # deploy key). The submodule MUST be on disk before `docker build` — .dockerignore strips
      # .git, so it cannot self-init inside the image.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}

      # Fail loud early if the submodule didn't check out (wrong/absent deploy key), rather than
      # silently building the OSS variant.
      - name: Verify @pierre/pro submodule is present
        run: test -f packages/pro/src/index.ts || (echo "packages/pro not checked out — is PRO_DEPLOY_KEY set?" && exit 1)

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the cloud image (WITH_PRO=true)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WITH_PRO=true
            VITE_GA_ID=${{ secrets.VITE_GA_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nudge Railway to pull the freshly-pushed :latest image. No-op when no token is set
      # (alternatively, turn on Railway's own "redeploy on image change"). Best-effort — a
      # failed redeploy never fails the build. If your RAILWAY_TOKEN is a PROJECT token, also
      # set RAILWAY_SERVICE to the service name so `redeploy` targets the right one.
      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        continue-on-error: true
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN — skipping (or enable Railway's redeploy-on-image-change)."
            exit 0
          fi
          if [ -n "$RAILWAY_SERVICE" ]; then
            npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE" --yes \
              || echo "Railway redeploy failed — check the token/service and that it pulls the GHCR image"
          else
            npx -y @railway/cli@latest redeploy --yes \
              || echo "Railway redeploy failed — a PROJECT token may need RAILWAY_SERVICE set"
          fi
