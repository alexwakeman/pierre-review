name: CI

# Quality gate for pull requests: the same checks the release pipeline runs
# (typecheck + unit tests + the browser E2E regression suite), so a PR can't merge
# with a broken My Turn / Feed / Focus-mode flow. Pushes to main are gated by the
# release workflow (which runs the identical checks before publishing), so this only
# triggers on pull_request to avoid double-running on main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E regression tests (My Turn / Feed / Focus)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
