name: CI

# Quality gate for pull requests: the same checks the release pipeline runs
# (typecheck + unit tests + the browser E2E regression suite), so a PR can't merge
# with a broken My Turn / Feed / Focus-mode flow. Pushes to main are gated by the
# release workflow (which runs the identical checks before publishing), so this only
# triggers on pull_request to avoid double-running on main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # ---- Marketing-site prerender guardrails ----
      # Every assertion that protects the prerendered landing site lives in
      # apps/landing/prerender.mjs — the seo:/app: marker check, the ≥1000-byte
      # per-route body floor, the "all 8 routes" check and the whole-page size
      # floor. Until this step existed NONE of them ran on a pull request: CI was
      # typecheck + test + audit only, apps/landing has no test script (so
      # `pnpm -r test` skips it entirely), and `pnpm package` runs only in the
      # release workflow, at publish time and after merge.
      #
      # That made the site's worst failure mode invisible to review: a broken
      # prerender still renders perfectly in a browser (JS fills it in) and is a
      # contentless shell to everything that does not run scripts — crawlers, link
      # unfurlers, AI agents. A PR that regressed it merged green.
      #
      # `pnpm build` is the whole recursive build, so this also catches a landing
      # page that fails to render server-side at all.
      - run: pnpm build

      # ---- Dependency vulnerability audit ----
      # BLOCKING at high. There was no audit step at all before 2026-07-26; the 8 high advisories
      # that existed then have been cleared (@fastify/static 9→10.1.2 for the path-traversal
      # route-guard bypass, drizzle-orm 0.38→0.45.2 for the SQL-injection-via-identifiers issue,
      # fastify→5.10, plus scoped `pnpm.overrides` for the transitive fast-uri / find-my-way /
      # hono / shell-quote / brace-expansion advisories no direct bump could reach).
      #
      # `--prod` scopes it to what actually ships or runs the service; a dev-only tool's advisory
      # should not block a product PR. `|| true` is deliberately ABSENT — an audit that cannot
      # fail is a report nobody reads.
      #
      # If this fires on something with no fix available, record the decision in
      # `pnpm.overrides` (or pin the dependency) rather than softening the threshold. Two
      # advisories are knowingly left below this gate and documented in CLAUDE.md: `uuid`
      # (moderate — needs v4-with-a-`buf`-argument, which neither node-cron nor vis-data does)
      # and `body-parser` (low — inside express inside the MCP SDK, which ships in no release
      # artifact). Both would cost a multi-major forced bump on someone else's dependency for a
      # code path this app never executes.
      - name: Dependency audit (high + critical, blocking)
        run: pnpm audit --audit-level high --prod

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E regression tests (My Turn / Feed / Focus)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
