name: CI

# Quality gate for pull requests: the same checks the release pipeline runs
# (typecheck + unit tests + the browser E2E regression suite), so a PR can't merge
# with a broken My Turn / Feed / Focus-mode flow. Pushes to main are gated by the
# release workflow (which runs the identical checks, and the WHOLE backend suite,
# before publishing), so this triggers on pull_request — plus a nightly run of
# everything on main, and on demand.
on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly, the whole suite on main: catches a slow-project test that broke through an input
    # no import reaches (docs/TESTING.md). 03:17 UTC, off the hour on purpose.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the slow-project step below diffs the PR against its base branch.
          fetch-depth: 0

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---- Which browser checks can this PR affect? (docs/TESTING.md) ----
      # The E2E suite answers every /api request from fixtures, and the demo check serves the
      # built SPA through apps/site — so neither reads a line of the backend. A PR that touches
      # none of the paths below cannot change their result, and skips them (~3 minutes). The
      # nightly and manual runs always take them; so does any PR that touches a manifest, the
      # lockfile or a workflow.
      - name: Paths this PR touches
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(apps/frontend/|apps/site/|packages/shared/|scripts/(verify-demo|record-demo)|playwright\.config\.ts$|pnpm-lock\.yaml$|(.*/)?package\.json$|\.github/workflows/)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm typecheck

      # The fast project (every backend file except the spawn-bound ones) + the site's tests.
      - run: pnpm test

      # ---- The slow backend project (vitest.workspace.ts, docs/TESTING.md) ----
      # Real git, the fake Codex CLI, the runtime installer, the ONNX scorer: ~93% of the suite's
      # time in ~5% of its files. A pull request runs the slow files whose IMPORT GRAPH holds a file
      # the PR changed (static and dynamic imports), and ALL of them when it touches an input no
      # import reaches (vitest.config.ts FORCE_RERUN_TRIGGERS: migrations, fixtures, spawned entry
      # files, package.json, the lockfile, this workflow). The nightly and manual runs take them all.
      - name: Slow backend tests (those this PR can affect)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm --filter @pierre-review/backend exec vitest run --project slow
          --changed origin/${{ github.base_ref }} --passWithNoTests

      - name: Slow backend tests (all)
        if: github.event_name != 'pull_request'
        run: pnpm test:slow

      # ---- Marketing-site prerender guardrails ----
      # Every assertion that protects the prerendered landing site lives in
      # apps/landing/prerender.mjs — the seo:/app: marker check, the ≥1000-byte
      # per-route body floor, the "all 8 routes" check and the whole-page size
      # floor. Until this step existed NONE of them ran on a pull request: CI was
      # typecheck + test + audit only, apps/landing has no test script (so
      # `pnpm -r test` skips it entirely), and `pnpm package` runs only in the
      # release workflow, at publish time and after merge.
      #
      # That made the site's worst failure mode invisible to review: a broken
      # prerender still renders perfectly in a browser (JS fills it in) and is a
      # contentless shell to everything that does not run scripts — crawlers, link
      # unfurlers, AI agents. A PR that regressed it merged green.
      #
      # `pnpm build` is the whole recursive build, so this also catches a landing
      # page that fails to render server-side at all.
      - run: pnpm build

      # ---- Dependency vulnerability audit ----
      # BLOCKING at high. There was no audit step at all before 2026-07-26; the 8 high advisories
      # that existed then have been cleared (@fastify/static 9→10.1.2 for the path-traversal
      # route-guard bypass, drizzle-orm 0.38→0.45.2 for the SQL-injection-via-identifiers issue,
      # fastify→5.10, plus scoped `pnpm.overrides` for the transitive fast-uri / find-my-way /
      # hono / shell-quote / brace-expansion advisories no direct bump could reach).
      #
      # `--prod` scopes it to what actually ships or runs the service; a dev-only tool's advisory
      # should not block a product PR. `|| true` is deliberately ABSENT — an audit that cannot
      # fail is a report nobody reads.
      #
      # If this fires on something with no fix available, record the decision in
      # `pnpm.overrides` (or pin the dependency) rather than softening the threshold. Two
      # advisories are knowingly left below this gate and documented in CLAUDE.md: `uuid`
      # (moderate — needs v4-with-a-`buf`-argument, which neither node-cron nor vis-data does)
      # and `body-parser` (low — inside express inside the MCP SDK, which ships in no release
      # artifact). Both would cost a multi-major forced bump on someone else's dependency for a
      # code path this app never executes.
      - name: Dependency audit (high + critical, blocking)
        run: pnpm audit --audit-level high --prod

      - name: Install Playwright browser
        if: steps.paths.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E regression tests (My Turn / Feed / Focus)
        if: steps.paths.outputs.browser == 'true'
        run: pnpm test:e2e

      # The static demo (limn-review.com/demo/) must answer every request the SPA in THIS PR makes.
      # A failure lists the missing requests: extend the seed + recorder steps and run
      # `pnpm demo:record` (CLAUDE.md § The website and the demo).
      - name: Demo answers every view
        if: steps.paths.outputs.browser == 'true'
        run: |
          pnpm --filter @pierre-review/frontend build:demo
          node scripts/verify-demo.mjs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
